[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dof_mcp*"]

[project]
name = "dof-ai-mcp-server"
version = "0.1.0"
description = "DOF-AI v2 MCP server: real-time tools over the Diario Oficial de la Federación (SIDOF JSON API)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "tzdata>=2024.1",  # zoneinfo data for America/Mexico_City on Windows / slim Lambda images
]

[project.optional-dependencies]
lambda = ["mangum>=0.19"]
dev = [
    "mangum>=0.19",
    "uvicorn>=0.30",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Spanish text legitimately contains ambiguous-looking unicode

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dof_mcp"]
ignore_missing_imports = true
