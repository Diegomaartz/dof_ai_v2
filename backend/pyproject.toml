[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*", "agent*", "api*", "core*"]

[tool.setuptools.package-data]
agent = ["prompts/*.md"]

[project]
name = "dof-ai-backend"
version = "0.1.0"
description = "DOF-AI v2 backend: structural legal RAG ingestion, LangGraph agent and Django API"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "pinecone>=7",
    "pydantic>=2.7",
    "pypdfium2>=4.30",
    "langgraph>=1.2,<2",
    "langchain-core>=1.8,<2",
    "langchain-aws>=1.10,<2",
    "mcp>=2.3,<3",
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.4",
    "uvicorn>=0.30",
    "tzdata>=2024.1",  # ZoneInfo("America/Mexico_City") on Windows and slim images without system tz data
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "django-stubs>=5.2",
    "djangorestframework-stubs>=3.16",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[bedrock-runtime,s3,ssm]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "core.settings_test"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Spanish text legitimately contains ambiguous-looking unicode

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag", "agent", "api", "core"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "core.settings_test"
ignore_missing_imports = true
